<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Back Board</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
    }

    body {
      background: red;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    #display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 5rem;
      padding: 2rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #input-container {
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }

    textarea {
      background: #ff8a8a; /* light red */
      color: black;
      font-size: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
      resize: none;
      overflow: hidden;
      box-sizing: border-box;

      min-width: 6ch;      /* prevents collapse */
      max-width: 90vw;
      white-space: nowrap;
    }

    /* mirror element for width sizing */
    #mirror {
      position: absolute;
      visibility: hidden;
      white-space: pre;
      font-size: 1.5rem;
      padding: 0.75rem 1.25rem;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>

  <div id="display">Call back</div>

  <div id="input-container">
    <textarea id="editor" rows="1">Call back</textarea>
  </div>

  <div id="mirror"></div>

  <script>
    const textarea = document.getElementById("editor");
    const display = document.getElementById("display");
    const mirror = document.getElementById("mirror");

    function sync() {
      display.textContent = textarea.value || "";
      resizeHeight();
      resizeWidth();
    }

    function resizeHeight() {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    }

    function resizeWidth() {
      mirror.textContent = textarea.value || " ";
      textarea.style.width = mirror.offsetWidth + "px";
    }

    textarea.addEventListener("input", sync);

    // Initial sizing to "Call back"
    sync();
  </script>

</body>
</html>
