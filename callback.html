<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Back Board</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
    }

    body {
      background: red;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Center display text */
    #display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 5rem;
      padding: 2rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Bottom input area */
    #input-container {
      padding: 1.5rem;
      display: flex;
      justify-content: center;
    }

    textarea {
      width: 60%;
      min-height: 3rem;
      max-width: 900px;
      resize: none;
      font-size: 1.5rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="display">Call back</div>

  <div id="input-container">
    <textarea id="editor" rows="1">Call back</textarea>
  </div>

  <script>
    const textarea = document.getElementById("editor");
    const display = document.getElementById("display");

    function sync() {
      display.textContent = textarea.value || "";
      autoResize();
    }

    function autoResize() {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    }

    textarea.addEventListener("input", sync);

    // Initial sizing
    sync();
  </script>

</body>
</html>
